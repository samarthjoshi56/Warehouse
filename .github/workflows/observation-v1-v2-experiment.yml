name: Observation V1 vs V2 experiment

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Warehouse scenario
        type: choice
        required: true
        default: B
        options: [A, B, C]
      episodes:
        description: Training episodes per seed and version
        type: number
        required: true
        default: 100
      train_seeds:
        description: Number of paired training seeds
        type: number
        required: true
        default: 3
      eval_seeds:
        description: Number of held-out evaluation seeds
        type: number
        required: true
        default: 30

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run paired experiment
        run: |
          PYTHONPATH=. python -m training.compare_observation_versions \
            --scenario "${{ inputs.scenario }}" \
            --episodes "${{ inputs.episodes }}" \
            --train-seeds "${{ inputs.train_seeds }}" \
            --eval-seeds "${{ inputs.eval_seeds }}" \
            --output-dir artifacts/observation_v1_v2
      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: observation-v1-v2-results
          path: artifacts/observation_v1_v2/
          if-no-files-found: error
          retention-days: 30
